name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  committed-pr-diff:
    name: Validate committed PR integration diff
    runs-on: ubuntu-latest
    steps:
      - name: Check out the synthetic merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify revision and check committed diff
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          actual_test_sha="$(git rev-parse HEAD)"
          if [[ "$actual_test_sha" != "$EXPECTED_TEST_SHA" ]]; then
            echo "::error::HEAD does not match the pull-request integration SHA."
            exit 1
          fi

          git cat-file -e "$EXPECTED_TEST_SHA^{commit}"

          parent_count="$(git rev-list --parents -n 1 HEAD | awk '{ print NF - 1 }')"
          if [[ "$parent_count" -ne 2 ]]; then
            echo "::error::Expected the GitHub pull-request synthetic merge commit."
            exit 1
          fi

          actual_base_sha="$(git rev-parse HEAD^1)"
          actual_head_sha="$(git rev-parse HEAD^2)"
          if [[ "$actual_base_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::Synthetic merge first parent does not match the event base SHA."
            exit 1
          fi
          if [[ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::Synthetic merge second parent does not match the PR head SHA."
            exit 1
          fi

          set +e
          git diff --quiet HEAD^1 HEAD
          diff_status=$?
          set -e

          case "$diff_status" in
            0)
              echo "::error::The committed PR integration diff is empty."
              exit 1
              ;;
            1)
              ;;
            *)
              echo "::error::Unable to inspect the committed PR integration diff."
              exit "$diff_status"
              ;;
          esac

          printf 'PR HEAD: %s\n' "$EXPECTED_HEAD_SHA"
          printf 'Tested integration revision: %s\n' "$EXPECTED_TEST_SHA"
          printf 'Tested base revision: %s\n' "$EXPECTED_BASE_SHA"

          git diff --check HEAD^1 HEAD

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Skill validation dependency
        run: python -m pip install -r requirements-ci.txt

      - name: Run shipped Skill workflow contract checks
        run: python3 -m unittest discover -s tests -p test_issue5_workflow.py -v

      - name: Run distribution and staging behavior tests
        run: python3 -m unittest discover -s tests -p test_skill_distribution.py -v

      - name: Run Codex-compatible temporary staging smoke test
        run: python3 -m unittest discover -s tests -p test_distribution_smoke.py -v

      - name: Run primary-main fast-forward safety tests
        run: python3 -m unittest discover -s tests -p test_primary_main_fast_forward.py -v

      - name: Check out the exact PR source for package provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: issue5-package-source
          fetch-depth: 0

      - name: Build and verify packages against the PR source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/issue5-package-source"
          package_dir="$(mktemp -d "${RUNNER_TEMP}/issue5-skill-packages.XXXXXX")"
          python3 scripts/skill_distribution.py package \
            --root "$source_root" \
            --output-dir "$package_dir" \
            --source-revision "$EXPECTED_SOURCE_SHA"
          python3 scripts/skill_distribution.py verify \
            --root "$source_root" \
            --artifact-dir "$package_dir" \
            --source-revision "$EXPECTED_SOURCE_SHA"
